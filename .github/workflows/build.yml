
name: Build Neon GX

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Neon GX executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name NeonGX
          --add-data "neon_gx_start.html;."
          neon_gx.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NeonGX-Windows
          path: dist/NeonGX.exe
          if-no-files-found: error
          retention-days: 30
